# git-cliff configuration: https://git-cliff.org/docs/configuration
[changelog]
header = """
# Changelog

All notable changes to workharbor are documented here. The file is generated from
Conventional Commits by `make changelog`; do not edit it by hand.

"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | split(pat="\n") | first | upper_first | trim }}\
{% for footer in commit.footers %}\
{% if footer.token is matching("^(Closes|Fixes|Resolves|Refs|Related)$") %} ({{ footer.value }}){% endif %}\
{% endfor %} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/wstein/workharbor/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^(build|ci)", group = "Build and CI" },
  { message = "^style", group = "Style" },
  { message = "^chore", group = "Maintenance" },
  { message = "^revert", group = "Reverts" },
]
