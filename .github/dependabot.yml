# Dependabot version updates. A 7-day cooldown keeps brand-new releases (and any
# compromised ones) out until they have had time to be noticed; security updates
# are not delayed. Tool versions pinned in the Makefile and the
# workflows are handled by Renovate (renovate.json), which Dependabot cannot read.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]

  # Container base images, pinned by digest. Whether Dependabot reads files named
  # Containerfile.<base> is unverified; the devcontainer's Dockerfile it reads.
  - package-ecosystem: docker
    directories: [/.devcontainer, /internal/baseimage, /internal/console]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies]
    groups:
      go:
        patterns: ["*"]

  # The documentation site is its own Go module (the Hextra theme).
  - package-ecosystem: gomod
    directory: /docs
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies]
    groups:
      docs:
        patterns: ["*"]
