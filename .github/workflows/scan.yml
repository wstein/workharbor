name: scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 1"

permissions: {}

env:
  GOTOOLCHAIN: local

jobs:
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
      - name: Scan the history for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --no-banner --redact --config .gitleaks.toml .
      # gitleaks git reads patches only: the messages of commits and annotated tags
      # go to it on stdin. They go through a file, not a pipe, so a failed git
      # fails the step instead of feeding gitleaks an empty input (as in make check-ci).
      - name: Scan commit and tag messages for secrets
        run: |
          set -eu
          m=$(mktemp)
          trap 'rm -f "$m"' EXIT
          scripts/messages.sh "" --all >"$m"
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 stdin --no-banner --redact --config .gitleaks.toml <"$m"

  docs-vulnerabilities:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
      # The docs module has no Go files of its own, so govulncheck has nothing to
      # analyse there; its dependencies are checked against the OSV database.
      - name: Check the docs module's dependencies for known vulnerabilities
        run: go run github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.6.0 scan source -L docs/go.mod
