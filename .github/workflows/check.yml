name: repository-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      # pull_request checks GitHub's ordinary synthetic merge into main, or into the parent branch of a stacked pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Native tool installers only; no product runtime, containers or activation.
      # SHAs resolved from the official repositories' tag API on 2026-10-14.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.1'
          package-manager-cache: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          version-type: strict
          otp-version: '29.1.1'
          elixir-version: '1.20.4'
          install-hex: false
          install-rebar: false
      - name: Install completion test shells
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zsh fish
      - name: Validate explicit repository acceptance
        run: python3 -I -B scripts/check_ci.py
