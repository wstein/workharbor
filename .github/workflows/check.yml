name: repository-checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  # Tiering: a pull request that changes only prose no check reads runs `docs`
  # instead of the full jobs. Any other change, unclear case or detection error,
  # and every push to main, runs everything. `check` is the one aggregate verdict.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        name: Classify changed paths (fail closed)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 -I -B scripts/ci_changes.py --event "$GITHUB_EVENT_NAME" --base "$BASE" --head "$HEAD"
  docs:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Check repository documents
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 -I -B scripts/check_repo.py
          git diff --check "$BASE...$HEAD"
  bootstrap:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      # pull_request checks GitHub's ordinary synthetic merge into main, or into the parent branch of a stacked pull request (for a native stack, into the parent PR's merge commit).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Native tool installers only; no product runtime, containers or activation.
      # SHAs resolved from the official repositories' tag API on 2026-10-14.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.1'
          package-manager-cache: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          version-type: strict
          otp-version: '29.1.1'
          elixir-version: '1.20.4'
          install-hex: false
          install-rebar: false
      - name: Install completion test shells
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zsh fish
      - name: Validate explicit repository acceptance
        run: python3 -I -B scripts/check_ci.py
  macos-pty:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      # Bind native PTY evidence to the PR source head, not a synthetic merge.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact tested head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          actual_head=$(git rev-parse HEAD)
          test "$actual_head" = "$EXPECTED_HEAD"
          worktree_status=$(git status --porcelain)
          test -z "$worktree_status"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Verify native harness, wizard and local shell PTYs
        shell: bash
        working-directory: apps/whr
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          expected=(
            TestPTYDrivesPromptAndCapturesTranscript
            TestPTYKeysAndEnvironment
            TestPTYInterruptDelivered
            TestPTYBackAndCancelPrompt
            TestPTYTimeoutFailsTest
            TestPTYNoLeakedProcess
            TestWizardPTYHappyPath
            TestWizardPTYInterruptRollsBack
            TestLocalShellPTYDirectStreamsAndResize
            TestLocalShellPTYRejectsNonTerminalBeforeDocker
            TestLocalShellPTYEnvironmentCanaries
            TestLocalShellPTYRedirectedStderrFallback
            TestLocalShellPTYExitAndLiveness
            TestLocalShellPTYPreflightSignalsExit72
          )
          selection=$(printf '%s|' "${expected[@]}")
          selection="^(${selection%|})$"
          listed=$(go test -list "$selection" ./internal/ptytest ./cmd/whr)
          printf '%s\n' "$listed"
          for name in "${expected[@]}"; do
            grep -Fx -- "$name" <<< "$listed"
          done
          if output=$(go test -v -count=1 -timeout=90s -run "$selection" ./internal/ptytest ./cmd/whr 2>&1); then
            printf '%s\n' "$output"
          else
            printf '%s\n' "$output"
            exit 1
          fi
          for name in "${expected[@]}"; do
            grep -Eq -- "^--- PASS: ${name} \\(" <<< "$output"
          done
          if grep -q -- '^[[:space:]]*--- SKIP:' <<< "$output"; then
            exit 1
          fi
      - name: Verify native Git capture and wait-without-reap
        shell: bash
        working-directory: apps/whr
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          selection='^Test(LocalStage(Git|Capture|Trust|FixtureStateRootUsesPhysicalAncestors)|Throwaway)'
          expected=()
          while IFS= read -r name; do
            [[ "$name" == TestLocalStage* || "$name" == TestThrowaway* ]] && expected+=("$name")
          done < <(go test -list "$selection" ./internal/localdocker)
          test "${#expected[@]}" -gt 0
          if output=$(go test -v -count=1 -timeout=360s -run "$selection" ./internal/localdocker 2>&1); then
            printf '%s\n' "$output"
          else
            printf '%s\n' "$output"
            exit 1
          fi
          for name in "${expected[@]}"; do
            grep -Eq -- "^--- PASS: ${name} \(" <<< "$output"
          done
          if grep -q -- '^[[:space:]]*--- SKIP:' <<< "$output"; then
            exit 1
          fi
  macos-hostsetup:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      # Bind native fixture evidence to the PR source head, not a synthetic merge.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact tested head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          actual_head=$(git rev-parse HEAD)
          test "$actual_head" = "$EXPECTED_HEAD"
          worktree_status=$(git status --porcelain)
          test -z "$worktree_status"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Verify portable hostsetup detection fixtures
        shell: bash
        working-directory: apps/whr
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          # All native helpers/files are owned temp fixtures; detector ports are fakes.
          # Exclude descendant/proc-zombie observation and the support-only helper ID.
          expected=(
            TestNativeDescriptorFS
            TestNativeProbeIsolationAndBounds
            TestNativeProbeRejectsAliasesAndUnsafeRequests
            TestNativeDetectorWiring
            TestNativeClosedAndSpecialFiles
            TestNativeNeverSignalsReleasedProcess
            TestNativeFailedStartAndNonzeroExit
            TestNativeOrbStackMetadataFixedRoute
            TestNativeOrbStackMetadataRejectsAliasesAndBounds
            TestNativeOrbStackMetadataProcessControls
            TestNativeExitedLeaderSignalPolicy
            TestNativeVerifiedDiskPathRejectsReplacement
            TestDetectStates
            TestDetectIsReadOnlyAndNeverRunsBrew
            TestDetectCLTGitShimNotExecuted
            TestDetectBudgetsSymlinksAndSources
            TestDetectProbeDeadlineIsNeverOK
            TestDetectSourceLookupConsumesProbeBudget
            TestDetectAncestorDirectoriesResolvedBeforeProbe
            TestDetectTerminalBudgetAndCancellation
            TestDetectOrbStackMetadataPresenceSourceAndBounds
          )
          selection=$(printf '%s|' "${expected[@]}")
          selection="^(${selection%|})$"
          listed=$(go test -list "$selection" ./internal/hostsetup/native ./internal/hostsetup/detect)
          printf '%s\n' "$listed"
          for name in "${expected[@]}"; do
            grep -Fx -- "$name" <<< "$listed"
          done
          if output=$(go test -v -count=1 -timeout=90s -run "$selection" ./internal/hostsetup/native ./internal/hostsetup/detect 2>&1); then
            printf '%s\n' "$output"
          else
            printf '%s\n' "$output"
            exit 1
          fi
          for name in "${expected[@]}"; do
            grep -Eq -- "^--- PASS: ${name} \\(" <<< "$output"
          done
          if grep -q -- '^[[:space:]]*--- SKIP:' <<< "$output"; then
            exit 1
          fi
  macos-dotfiles:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      # Bind native fixture evidence to the PR source head, not a synthetic merge.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact tested head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          actual_head=$(git rev-parse HEAD)
          test "$actual_head" = "$EXPECTED_HEAD"
          worktree_status=$(git status --porcelain)
          test -z "$worktree_status"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Verify native dotfiles adapter on macOS
        shell: bash
        working-directory: apps/whr
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          # Owned temp fixtures only: exercises RENAME_EXCL and no-follow fchmodat on Darwin.
          expected=(
            TestDotfileDiffBackupAtomic
            TestDotfileBoundsAndCatalogueBinding
            TestExistingDifferentNeedsConfirmation
            TestSymlinkTargetRefused
            TestChangedSincePreviewRefused
            TestDryRunWritesNothing
            TestDotfileFailuresPreserveOriginal
            TestDotfileCorruptionAndRecoveryFailure
            TestDotfileManifestRetainsEachOriginal
            TestNewFilePreviewContainsEveryLine
            TestDotfileConsentAndConcurrentReplacement
            TestFailedManifestStageDoesNotBlockNextFile
            TestFailedStageCleanupPreservesForeignObject
            TestRollbackReconcilesAmbiguousMutations
            TestPreviewRefusesAnotherEngineWithSameFS
            TestNativeDotfileLifecycle
            TestNativeDryRunLeavesTreeUnchanged
            TestNativeNoFollowAndSpecialRefusals
            TestNativeDescriptorRaceRefusals
            TestNativeExclusiveIdentityAndAtomicity
            TestNativeRollbackAndStageOwnership
            TestNativeKernelNoReplacePreservesOccupiedDestination
            TestNativeRenameAbsentRefusesLateOccupant
            TestNativeReadRefusesLeafLinkToSameInode
            TestNativeWalkRefusesParentLinkToSameInode
            TestNativeMkdirChmodDoesNotFollowSwappedLink
          )
          selection=$(printf '%s|' "${expected[@]}")
          selection="^(${selection%|})$"
          listed=$(go test -list "$selection" ./internal/hostsetup/dotfiles)
          printf '%s\n' "$listed"
          for name in "${expected[@]}"; do
            grep -Fx -- "$name" <<< "$listed"
          done
          if output=$(go test -v -count=1 -timeout=90s -run "$selection" ./internal/hostsetup/dotfiles 2>&1); then
            printf '%s\n' "$output"
          else
            printf '%s\n' "$output"
            exit 1
          fi
          for name in "${expected[@]}"; do
            grep -Eq -- "^--- PASS: ${name} \\(" <<< "$output"
          done
          if grep -q -- '^[[:space:]]*--- SKIP:' <<< "$output"; then
            exit 1
          fi
  check:
    needs: [changes, docs, bootstrap, macos-pty, macos-hostsetup, macos-dotfiles]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the jobs this change needs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 -I -B scripts/ci_changes.py --gate
