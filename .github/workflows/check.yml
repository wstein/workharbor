name: repository-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      # pull_request checks GitHub's ordinary synthetic merge into main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Native tool installers only; no product runtime, containers or activation.
      # SHAs resolved from the official repositories' tag API on 2026-10-14.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.11.1'
          package-manager-cache: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          version-type: strict
          otp-version: '29.1.1'
          elixir-version: '1.20.4'
          install-hex: false
          install-rebar: false
      - name: Validate explicit repository acceptance
        run: python3 -I -B scripts/check_ci.py
