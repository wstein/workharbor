name: repository-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tests verify pinned legacy code and evidence against ancestor commits.
          fetch-depth: 0
      - run: python3 --version && make check
