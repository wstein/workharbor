name: repository-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      # pull_request checks GitHub's ordinary synthetic merge into main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate explicit repository acceptance
        run: python3 -I -B scripts/check_ci.py
