name: scorecard

# Publishes the OpenSSF Scorecard results to scorecard.dev. The API accepts
# results only from a workflow of this shape (ossf/scorecard-action, "Workflow
# restrictions"): no workflow-level env or defaults, no workflow-level write
# permissions, id-token: write on this job only, and only approved actions in
# the job. Keep it free of run steps and extra actions.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 3"
  branch_protection_rule:

permissions: {}

jobs:
  scorecard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload the results to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
          category: scorecard
