name: fuzz

# Native Go fuzz targets for the parsers of untrusted input (issue #110). They run on
# a schedule and on request, never on a push or a pull request: a fuzz run is open
# ended, and a crash it finds is fixed with a regression test from its corpus entry.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time for each target, as go's -fuzztime (for example 2m)
        required: false
        default: 2m

permissions: {}

env:
  GOTOOLCHAIN: local

jobs:
  fuzz:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
      - name: Fuzz every target
        env:
          FUZZTIME: ${{ inputs.fuzztime || '2m' }}
        run: |
          # an input is data, not a command: only a go duration or an exec count
          printf '%s' "$FUZZTIME" | grep -Eq '^[0-9]+(s|m|h|x)$' || { echo "fuzztime must be like 2m, 90s or 5000x" >&2; exit 2; }
          make fuzz
      - name: Keep the inputs that crashed a target
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore
