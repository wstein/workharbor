name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

env:
  GOTOOLCHAIN: local

jobs:
  check:
    # Explicit name: the ruleset requires `check (1.26.x)` and `check (1.27.x)`, and a
    # name containing a matrix expression gets no automatic matrix suffix.
    name: check (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.26.x', '1.27.x']
        # setup-go's manifest lags go.dev, so a range resolves to a vulnerable patch (#497);
        # `include` only adds `version` to the matching `go` entries.
        include:
          - go: '1.26.x'
            version: '1.26.9'
          - go: '1.27.x'
            version: '1.27.2'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.version }}
          cache: true
          cache-dependency-path: go.sum
      - name: Download Go modules (retried, #461)
        # A proxy.golang.org stream error failed make vet once; retry the fetch
        # up to 3 times, 10 s apart, so only a persistent failure fails the job.
        run: |
          for attempt in 1 2 3; do
            go mod download && exit 0
            [ "$attempt" -lt 3 ] && { echo "::warning::go mod download failed, retrying in 10s ($attempt/3)"; sleep 10; }
          done
          exit 1
      - name: Check format, lint, editorconfig and tests
        if: matrix.go == '1.27.x'
        run: make check
      - name: Check Go 1.26 build, vet, tests and race detection
        if: matrix.go == '1.26.x'
        run: make build vet test race

  agent-cli:
    # The proof that nothing planted in a repository or an agent home configures
    # the Claude Code CLI (#68, #79) needs the real CLI. It is not logged in:
    # hooks, MCP servers and skills load before the model call fails.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLAUDE_VERSION: 2.1.285
      # linux-x64 checksum from the vendor's manifest for this version; the
      # linux-arm64 one there matches internal/toolstore/pins.json.
      CLAUDE_SHA256: 33dad1ec615a2e08cc78b494f05c110e49916de2c79d78ec8799ebf46b233d29
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
      - name: Install the pinned Claude Code CLI
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --proto '=https' "https://downloads.claude.ai/claude-code-releases/$CLAUDE_VERSION/linux-x64/claude" -o "$RUNNER_TEMP/bin/claude"
          echo "$CLAUDE_SHA256  $RUNNER_TEMP/bin/claude" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/claude"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Prove planted configuration does not take effect
        env:
          WHR_REQUIRE_CLAUDE: "1"
        run: go test -count=1 -run 'TestPlanted' ./internal/agent/claude/

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
      - name: Check commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: go run ./cmd/commitlint --range "$BASE..$HEAD"
