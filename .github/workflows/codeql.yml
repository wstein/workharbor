name: codeql

# Static analysis (SAST) of the Go code with CodeQL. OpenSSF Scorecard's SAST
# check recognises github/codeql-action by name; golangci-lint (make lint) is
# not recognised. Results go to code scanning.
#
# Pull requests into main are analysed as well: Scorecard's SAST check counts
# the share of recent commits that were checked by the tool, and commits that
# only ever reach main through a PR are otherwise never analysed. Fork PRs are
# skipped (read-only token, no security-events: write). CodeQL is not a
# required check.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 2"

permissions: {}

env:
  GOTOOLCHAIN: local

jobs:
  analyze:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: go
          build-mode: autobuild
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: codeql-go
