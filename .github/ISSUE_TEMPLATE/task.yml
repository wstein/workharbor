name: Task or proposal
description: A feature, improvement, spike or design question
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Every `feat`, `fix`, `perf` and `refactor` commit references an issue, so please describe the work here before opening a pull request. Check the [design](https://wstein.github.io/workharbor/docs/design/) first; open decisions are in section 12. Use the decision template for a choice between options.
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Feature
        - Improvement or refactor
        - Spike or investigation
        - Documentation
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should change, and why?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: One checkbox per measurable criterion, with an observable result or threshold. Tick each met criterion when closing out the work, before push (AGENTS.md).
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: scenarios
    attributes:
      label: Acceptance scenarios
      description: Optional for substantial work. Describe the starting conditions, action and observable result.
      placeholder: |
        Given ...
        When ...
        Then ...
    validations:
      required: false
  - type: textarea
    id: unknowns
    attributes:
      label: Explicit unknowns
      description: Optional for substantial work. What is not known yet, and which investigation or measurement will resolve each unknown?
      placeholder: |
        Unknown: ...
        How it will be found out: ...
    validations:
      required: false
  - type: textarea
    id: verification
    attributes:
      label: How it is verified
      description: A test, a whr command or a measurement that shows each criterion is met.
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Design impact
      description: Which section or decision (D1, D2, ...) does this touch? Write "none" if it touches none. Mark claims about external tools as unverified.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this issue deliberately leaves for later, if anything.
