name: Task or proposal
description: A feature, improvement, spike or design question
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Every `feat`, `fix`, `perf` and `refactor` commit references an issue, so please describe the work here before opening a pull request. Check the [design](https://wstein.github.io/workharbor/docs/design/) first; open decisions are in section 12.
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Feature
        - Improvement or refactor
        - Spike or investigation
        - Design question or decision
        - Documentation
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should change, and why?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know it is done?
      placeholder: |
        - [ ] ...
  - type: textarea
    id: design
    attributes:
      label: Design impact
      description: Which section or decision (D1, D2, ...) does this touch? Mark claims about external tools as unverified.
