<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>transcript spike</title>
<style>
:root { color-scheme: dark; --bg:#0b1626; --panel:#0f2038; --line:#1f3556; --fg:#e6edf7; --mute:#9fb3c8; --accent:#5eead4; --warn:#fbbf24; --bad:#f87171; }
* { box-sizing: border-box; }
body { margin: 0; height: 100dvh; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
header b { font-size: 16px; }
.pill { padding: 2px 10px; border-radius: 999px; background: var(--line); font-size: 12px; }
.pill.working { background: #10294d; color: #60a5fa; }
.pill.idle { background: #11331f; color: #4ade80; }
.pill.bad { background: #3a1518; color: var(--bad); }
.meter { flex: 1; min-width: 140px; font-size: 12px; color: var(--mute); }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 3px; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; }
#log { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 88%; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.user { align-self: flex-end; background: #13294a; border: 1px solid var(--accent); }
.text { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
.note { align-self: flex-start; color: var(--mute); font-size: 13px; }
details { align-self: flex-start; max-width: 92%; font-size: 13px; color: var(--mute); }
details pre { margin: 6px 0 0; padding: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
.err { align-self: flex-start; color: var(--bad); font-size: 13px; }
form { display: flex; gap: 8px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
textarea { flex: 1; min-height: 44px; max-height: 120px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font: inherit; resize: none; }
button { min-height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: var(--accent); color: #06231f; font: inherit; font-weight: 600; cursor: pointer; }
button.ghost { background: transparent; border: 1px solid var(--line); color: var(--fg); }
button.deny { background: transparent; border: 1px solid var(--bad); color: var(--bad); }
select { min-height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font: inherit; }
.pill.ask { background: #3a2d0b; color: var(--warn); }
.approval { align-self: flex-start; max-width: 92%; padding: 12px 14px; border-radius: 12px; border: 1px solid #6b4f0a; background: #2a2209; display: flex; flex-direction: column; gap: 8px; }
.approval.done { border-color: var(--line); background: var(--panel); }
.approval .row { display: flex; gap: 8px; flex-wrap: wrap; }
.approval pre { margin: 0; padding: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 180px; overflow: auto; font-size: 12px; }
</style>
</head>
<body>
<header>
  <b>transcript spike</b>
  <span id="status" class="pill">connecting</span>
  <span id="auth" class="pill"></span>
  <label for="mode" hidden>Permission mode</label>
  <select id="mode" title="Permission mode: what the agent may do without asking"></select>
  <div class="meter"><span id="usage">usage: n/a</span><div class="bar"><i id="usagebar"></i></div></div>
  <button type="button" class="ghost" id="cancel">Cancel</button>
</header>
<div id="log" role="log" aria-live="polite"></div>
<form id="form">
  <label for="box" hidden>Message</label>
  <textarea id="box" placeholder="Start a task, or message the running agent"></textarea>
  <button type="submit" id="send">Send</button>
</form>
<script>
// Everything from the agent is untrusted: only textContent is used, never innerHTML.
const log = document.getElementById('log');
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };
let status = 'none', alive = false;

function add(node) {
  const near = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  log.appendChild(node);
  if (near) log.scrollTop = log.scrollHeight;
}
function setStatus(s) {
  status = s;
  const p = document.getElementById('status');
  p.textContent = s;
  p.className = 'pill ' + (s === 'working' ? 'working' : s === 'idle' ? 'idle' : s === 'awaiting approval' ? 'ask' : (s.startsWith('exited') || s === 'auth expired') ? 'bad' : '');
}
// The answer streams in as deltas; the final message then replaces the live bubble.
let live = null;
function appendDelta(text) {
  const near = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  if (!live) { live = el('div', 'msg text'); log.appendChild(live); }
  live.textContent += text;
  if (near) log.scrollTop = log.scrollHeight;
}
function authCard() {
  const c = el('div', 'approval');
  c.appendChild(el('b', '', 'Login expired or missing'));
  c.appendChild(el('div', '', 'The agent could not authenticate. The run is paused and nothing is lost. Log in again on the host (claude /login), then send a message to resume.'));
  return c;
}
// apiKeySource is "none" when no API key is in use, which means a subscription login.
const authLabel = (a) => a === 'none' ? 'subscription (no API key)' : (a || '?');
const approvals = {};
function approvalCard(e) {
  const d = e.data || {};
  const card = el('div', 'approval');
  card.appendChild(el('b', '', 'Approval needed: ' + e.tool));
  card.appendChild(el('pre', '', JSON.stringify(d.input, null, 2)));
  const row = el('div', 'row');
  const ok = el('button', '', 'Approve once'); const no = el('button', 'deny', 'Deny');
  const answer = async (allow) => {
    ok.disabled = no.disabled = true;
    const r = await fetch('approve', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: d.id, allow }) });
    if (!r.ok) { card.appendChild(el('div', 'err', await r.text())); }
  };
  ok.onclick = () => answer(true); no.onclick = () => answer(false);
  row.append(ok, no); card.appendChild(row);
  approvals[d.id] = { card, row };
  return card;
}
function details(summary, body) {
  const d = el('details'); d.appendChild(el('summary', '', summary));
  if (body) d.appendChild(el('pre', '', body));
  return d;
}
function render(e) {
  switch (e.kind) {
    case 'session': {
      const d = e.data || {};
      document.getElementById('auth').textContent = authLabel(d.auth);
      add(el('div', 'note', 'session ' + (d.session_id || '') + ' · ' + (d.model || '')));
      break;
    }
    case 'user': add(el('div', 'msg user', e.text)); break;
    case 'delta': appendDelta(e.text); break;
    case 'text': if (live) { live.remove(); live = null; } add(el('div', 'msg text', e.text)); break;
    case 'auth_expired': add(authCard()); break;
    case 'thinking': break;
    case 'tool_call': add(details('tool: ' + e.tool, JSON.stringify(e.data, null, 2))); break;
    case 'tool_result': add(details('result', e.text)); break;
    case 'usage': {
      const w = e.data && e.data.unifiedWindows && e.data.unifiedWindows.five_hour;
      if (w) {
        const pct = Math.round(w.utilization * 100);
        const reset = new Date(w.resetsAt * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        document.getElementById('usage').textContent = 'five-hour window ' + pct + '% · resets ' + reset + ' · ' + e.data.status;
        document.getElementById('usagebar').style.width = pct + '%';
      }
      break;
    }
    case 'result': {
      const d = e.data || {};
      add(el('div', 'note', 'turn done · ' + d.turns + ' turns · $' + (d.cost_usd || 0).toFixed(4)));
      break;
    }
    case 'approval': add(approvalCard(e)); break;
    case 'approval_result': {
      const a = approvals[(e.data || {}).id];
      if (a) { a.card.className = 'approval done'; a.row.replaceWith(el('div', 'note', e.text + (e.data.message ? ': ' + e.data.message : ''))); }
      break;
    }
    case 'permission': add(el('div', 'note', 'blocked by policy: ' + e.tool)); break;
    case 'mode': { const m = document.getElementById('mode'); if (m.value !== e.text) m.value = e.text; add(el('div', 'note', 'permission mode: ' + e.text)); break; }
    case 'status': setStatus(e.text); break;
    case 'error': add(el('div', 'err', e.text)); break;
  }
}

// EventSource reconnects by itself and sends Last-Event-ID, so a reload or a
// dropped connection replays exactly the events it missed.
const es = new EventSource('events');
es.onmessage = (m) => render(JSON.parse(m.data));
es.onerror = () => document.getElementById('status').textContent = 'reconnecting';

async function post(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) add(el('div', 'err', path + ': ' + (await r.text())));
  return r.ok;
}
document.getElementById('form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const box = document.getElementById('box');
  const text = box.value.trim();
  if (!text) return;
  const s = await (await fetch('state')).json();
  const mode = document.getElementById('mode').value;
  const ok = await post(s.process_alive ? 'say' : 'start?mode=' + mode + (s.session_id ? '&resume=1' : ''), { text });
  if (ok) box.value = '';
});
document.getElementById('cancel').addEventListener('click', () => post('cancel'));

// The mode is fixed when the agent process starts, so changing it on a running
// session restarts the process with --resume (the session and transcript carry on).
const modeSel = document.getElementById('mode');
fetch('state').then((r) => r.json()).then((s) => {
  for (const [k, v] of Object.entries(s.modes)) { const o = el('option', '', k); o.value = k; o.title = v; modeSel.appendChild(o); }
  modeSel.value = s.mode || 'manual';
});
modeSel.addEventListener('change', async () => {
  const s = await (await fetch('state')).json();
  if (!s.process_alive) return;
  await post('cancel');
  for (let i = 0; i < 30; i++) { await new Promise((r) => setTimeout(r, 300)); if (!(await (await fetch('state')).json()).process_alive) break; }
  await post('start?resume=1&mode=' + modeSel.value);
});
</script>
</body>
</html>
