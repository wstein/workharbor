<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inbox</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 1360px; height: 900px; box-sizing: border-box; display: flex; background: #0b1626; color: #e6edf7; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px">
  <aside style="width: 232px; box-sizing: border-box; padding: 22px 14px; display: flex; flex-direction: column; gap: 28px; background: #0a1322; border-right: 1px solid #1f3556">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
      <svg viewBox="0 0 64 64" width="28" height="28" aria-hidden="true"><g fill="none" stroke="{{accent}}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="12" r="5.5"/><path d="M32 18V54"/><path d="M22 28H42"/><path d="M12 38Q12 55 32 55Q52 55 52 38"/><path d="M6 43L12 37L18 43"/><path d="M46 43L52 37L58 43"/></g></svg>
      <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.01em">workharbor</span>
    </div>
    <nav style="display: flex; flex-direction: column; gap: 2px">
      <a href="Main.dc.html" style="display: flex; align-items: center; padding: 9px 12px; border-radius: 8px; color: #c7d3e6">Harbor</a>
      <a href="Inbox.dc.html" style="display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; border-radius: 8px; background: #13294a; font-weight: 500">Inbox <span style="min-width: 20px; padding: 1px 6px; box-sizing: border-box; text-align: center; border-radius: 999px; background: {{ badge.bg }}; color: {{ badge.fg }}; font-size: 12px; font-weight: 600">{{ openCount }}</span></a>
      <div style="padding: 9px 12px; color: #9fb3c8">Tasks</div>
      <div style="padding: 9px 12px; color: #9fb3c8">Workspaces</div>
      <div style="padding: 9px 12px; color: #9fb3c8">Policy</div>
      <div style="padding: 9px 12px; color: #9fb3c8">Audit log</div>
    </nav>
  </aside>

  <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 28px 32px; display: flex; flex-direction: column; gap: 22px">
    <header style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.015em">Inbox</h1>
      <div style="color: #9fb3c8">{{ subtitle }}</div>
    </header>

    <div style="flex-grow: 1; min-height: 0; display: flex; gap: 24px">
      <section style="width: 420px; flex: none; display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{ items }}" as="it" hint-placeholder-count="6">
          <button onClick="{{ it.pick }}" style="text-align: left; display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 12px; border: 1px solid {{ it.border }}; background: {{ it.bg }}; color: #e6edf7; font: inherit; cursor: pointer; opacity: {{ it.opacity }}">
            <div style="display: flex; justify-content: space-between; align-items: center">
              <span style="padding: 3px 9px; border-radius: 999px; background: {{ it.kindBg }}; color: {{ it.kindFg }}; font-size: 12px; font-weight: 600">{{ it.kind }}</span>
              <span style="color: #9fb3c8; font-size: 12px; font-family: 'IBM Plex Mono', monospace">{{ it.ref }}</span>
            </div>
            <div style="font-weight: 500; line-height: 1.4">{{ it.title }}</div>
            <div style="color: {{ it.statusFg }}; font-size: 12px">{{ it.status }}</div>
          </button>
        </sc-for>
      </section>

      <section style="flex-grow: 1; min-width: 0; padding: 26px; border-radius: 12px; border: 1px solid #1f3556; background: #0f2038; display: flex; flex-direction: column; gap: 18px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="color: #9fb3c8; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em">{{ cur.kindLong }}</span>
          <h2 style="margin: 0; font-size: 20px; font-weight: 600; line-height: 1.35">{{ cur.title }}</h2>
        </div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <sc-for list="{{ cur.tags }}" as="tg" hint-placeholder-count="2">
            <span style="padding: 3px 9px; border-radius: 999px; background: {{ tg.bg }}; color: {{ tg.fg }}; font-size: 12px; font-weight: 600">{{ tg.label }}</span>
          </sc-for>
        </div>
        <div style="line-height: 1.6; color: #c7d3e6">{{ cur.body }}</div>
        <div style="padding: 14px 16px; border-radius: 10px; background: #0b1626; border: 1px solid #1f3556; font-size: 13px; line-height: 1.6; color: #9fb3c8">{{ cur.context }}</div>
        <sc-if value="{{ cur.isOpen }}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; gap: 10px">
            <span style="font-weight: 600">Your answer</span>
            <sc-for list="{{ cur.options }}" as="opt" hint-placeholder-count="3">
              <button onClick="{{ opt.pick }}" style="display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px 14px; border-radius: 10px; border: 1px solid {{ opt.border }}; background: {{ opt.bg }}; color: #e6edf7; font: inherit; cursor: pointer"><span style="width: 14px; height: 14px; flex: none; border-radius: 999px; border: 2px solid {{ opt.ring }}; background: {{ opt.dot }}"></span>{{ opt.label }}</button>
            </sc-for>
            <div style="display: flex; gap: 10px; margin-top: 4px">
              <button onClick="{{ cur.submit }}" style="padding: 11px 20px; border: 0; border-radius: 8px; background: {{accent}}; color: #06231f; font: inherit; font-weight: 600; cursor: pointer; opacity: {{ cur.submitOpacity }}">Send answer</button>
              <span style="align-self: center; color: #6b819e; font-size: 12px">{{ cur.hint }}</span>
            </div>
          </div>
        </sc-if>
        <sc-if value="{{ cur.isDone }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 10px">
            <div style="padding: 14px 16px; border-radius: 10px; background: #11331f; color: #86efac">Answered: <strong style="color: #ffffff">{{ cur.answerLabel }}</strong>. {{ cur.doneText }}</div>
            <button onClick="{{ cur.undo }}" style="align-self: flex-start; padding: 8px 14px; border-radius: 8px; border: 1px solid #1f3556; background: transparent; color: #c7d3e6; font: inherit; cursor: pointer">Change answer</button>
          </div>
        </sc-if>
        <sc-if value="{{ cur.isClosed }}" hint-placeholder-val="{{ false }}">
          <div style="padding: 14px 16px; border-radius: 10px; background: #3a1518; color: #fca5a5; line-height: 1.6">{{ cur.closedText }}</div>
        </sc-if>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5eead4","options":["#5eead4","#60a5fa","#fbbf24","#f472b6"]},"$preview":{"width":1360,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#5eead4';
    const sel = this.state.sel ?? 0;
    const picks = this.state.picks ?? {};
    const done = this.state.done ?? {};
    const defs = [
      {
        kind: 'Question', kindLong: 'Question from the agent', kindBg: '#3a2d0b', kindFg: '#fbbf24', ref: '#15',
        title: 'Allow proxy.golang.org and sum.golang.org in the default egress allowlist?',
        body: 'The egress proxy needs to fetch Go modules to run the tests. The default policy blocks everything except the forge, the package registries you configured and the LLM API.',
        context: 'Decision d-31 · task t-15 awaiting guidance · run r-88 · Claude Code · claude-sonnet-5-5. Blocking: the agent waits for your answer.',
        options: ['Allow both, and log every request', 'Allow only sum.golang.org', 'Deny for now and ask me per dependency'],
        hint: 'Sent to the agent as an instruction.', doneText: 'The agent has been told and continues.', waiting: 'Open · waiting for you',
      },
      {
        kind: 'Approval', kindLong: 'Tool approval, the agent is blocked', kindBg: '#10294d', kindFg: '#60a5fa', ref: '#15',
        title: 'Write internal/proxy/allowlist.go?',
        body: 'The agent wants to use Write on a file inside the workspace. Its input is 2,184 characters; the Decision keeps the first 2,000 and the agent keeps the full text. All of it is untrusted data.',
        context: 'Decision d-32 · task t-15 · run r-88 · Claude Code · mode Manual. Deadline 09:54, 08:42 left: with no answer the approval expires and counts as deny. A late allow is refused.',
        tags: [{ label: 'input truncated', bg: '#3a2d0b', fg: '#fbbf24' }, { label: 'fails closed in 08:42', bg: '#3a1518', fg: '#f87171' }],
        options: ['Approve once', 'Deny with a reason'],
        hint: 'Recorded in the audit log.', doneText: 'The agent continues in the same live session.', waiting: 'Open · fails closed in 08:42',
      },
      {
        kind: 'Plan', kindLong: 'Plan approval', kindBg: '#2a1f4a', kindFg: '#a78bfa', ref: '#12',
        title: 'Approve the plan for the run interrupted state?',
        body: 'The agent worked in Plan mode and finished its plan: add the state, adjust the reconciler to set it on orphaned runs, add table-driven tests for the transitions. It changes nothing until you approve.',
        context: 'Decision d-33 · task t-12 awaiting guidance · run r-91 · Claude Code · mode Plan. Deadline 10:06, 6:10 left, then it counts as deny. Approving moves the agent out of Plan mode.',
        tags: [{ label: 'fails closed in 6:10', bg: '#3a1518', fg: '#f87171' }],
        options: ['Approve the plan', 'Ask for changes'],
        hint: 'The plan is the subject of this approval.', doneText: 'The agent leaves Plan mode and starts the work.', waiting: 'Open · fails closed in 6:10',
      },
      {
        kind: 'Review', kindLong: 'Review: ready to push?', kindBg: '#0f3733', kindFg: '#5eead4', ref: '#9',
        title: 'Ready to push? Reconciler: orphaned runs at 3c71a9e',
        body: 'Cleanup is done on agent/runtime from workspace whr-main: exported from the running environment as a bundle, rebased onto main, folded into 2 commits, messages checked, signed with the bot key, make check passed. 312 lines added, 41 removed in 9 files.',
        context: 'Decision d-29 · task t-9 ready for review. This approval covers commit 3c71a9e only; a newer commit needs a new one. On approval the supervisor, not the agent, pushes as the workharbor GitHub App and opens the PR; CI then runs on 3c71a9e.',
        tags: [{ label: 'commit 3c71a9e', bg: '#0f3733', fg: '#5eead4' }],
        options: ['Push and open the pull request', 'Decline and ask for rework'],
        hint: 'Approving does not merge. Merging stays with you, on GitHub.', doneText: 'The supervisor pushes 3c71a9e and opens the PR.', waiting: 'Open · no deadline',
      },
      {
        kind: 'Login', kindLong: 'Agent login expired', kindBg: '#3a1518', kindFg: '#f87171', ref: '#16',
        title: 'Claude Code login expired in workspace whr-docs',
        body: 'The subscription login in this environment can no longer refresh, so run r-90 is paused and task t-16 awaits guidance. The workspace, session and all files are kept. Sign in again inside the environment with Claude Code\'s own login (whr console whr-docs, then claude), then answer here.',
        context: 'Decision d-30 · auth_expired · paused at 09:58. Usage window not affected. workharbor never reads, stores or relays the login (D40).',
        options: ['Signed in again, resume', 'Cancel'],
        hint: 'No credentials pass through this page or through workharbor.', doneText: 'The run resumes from its session.', waiting: 'Open · waiting for you',
      },
      {
        kind: 'Rebase', kindLong: 'Rebase conflict', kindBg: '#3a2410', kindFg: '#fb923c', ref: '#18',
        title: 'agent/docs does not rebase onto main',
        body: 'Before exporting agent/docs, the supervisor rebased it onto main inside the environment and stopped at a conflict in 2 files. The rebase was aborted, so the branch is as the agent left it. The paths come from git and are untrusted data: README.md, docs/content/docs/manual/host-setup.md.',
        context: 'Decision d-34 · task t-18 awaiting guidance · raised for the stopped run r-93 · workspace whr-docs, agent docs.',
        tags: [{ label: '2 paths', bg: '#3a2410', fg: '#fb923c' }],
        options: ['Rework: a new run resolves it', 'Resolved in the console, retry', 'Cancel'],
        hint: 'Rework starts a new run whose briefing names these paths.', doneText: 'The answer is recorded; the supervisor acts on it.', waiting: 'Open · waiting for you',
      },
      {
        kind: 'Approval', kindLong: 'Tool approval, expired', kindBg: '#1b2a42', kindFg: '#9fb3c8', ref: '#11',
        title: 'Bash: go test ./internal/policy/... -count=50',
        body: 'Nobody answered within 10 minutes, so this approval expired at 08:51 and counted as deny. The agent was told and carried on without running the command.',
        context: 'Decision d-27 · task t-11 · run r-89. Statuses: open, answered, expired (deadline passed) and superseded (the supervisor restarted). Only answered with allow permits anything.',
        tags: [{ label: 'expired', bg: '#1b2a42', fg: '#9fb3c8' }],
        options: [], closed: 'Expired at 08:51 with no answer: denied. Nothing to answer; it stays in the audit log.',
        hint: '', doneText: '', waiting: '',
      },
    ];
    const items = defs.map((d, i) => {
      const isDone = done[i] !== undefined;
      const on = i === sel;
      return {
        kind: d.kind, kindBg: d.kindBg, kindFg: d.kindFg, ref: d.ref, title: d.title,
        status: d.closed ? 'Expired · denied' : (isDone ? 'Answered: ' + d.options[done[i]] : d.waiting),
        statusFg: d.closed ? '#6b819e' : (isDone ? '#9fb3c8' : (d.tags && d.kind !== 'Review' ? '#fbbf24' : '#9fb3c8')),
        bg: on ? '#13294a' : '#0f2038', border: on ? accent : '#1f3556', opacity: (isDone || d.closed) ? 0.6 : 1,
        pick: () => this.setState({ sel: i }),
      };
    });
    const d = defs[sel];
    const p = picks[sel] ?? null;
    const isDone = done[sel] !== undefined;
    const cur = {
      kindLong: d.kindLong, title: d.title, body: d.body, context: d.context, hint: d.hint, doneText: d.doneText,
      tags: d.tags ?? [],
      isOpen: !isDone && !d.closed, isDone, isClosed: !!d.closed, closedText: d.closed ?? '',
      answerLabel: isDone ? d.options[done[sel]] : '',
      submitOpacity: p === null ? 0.4 : 1,
      options: d.options.map((label, i) => {
        const on = p === i;
        return { label, bg: on ? '#13294a' : '#0b1626', border: on ? accent : '#1f3556', ring: on ? accent : '#6b819e', dot: on ? accent : 'transparent', pick: () => this.setState({ picks: Object.assign({}, picks, { [sel]: i }) }) };
      }),
      submit: () => { if (p !== null) this.setState({ done: Object.assign({}, done, { [sel]: p }) }); },
      undo: () => { const next = Object.assign({}, done); delete next[sel]; this.setState({ done: next }); },
    };
    const openCount = defs.filter((x, i) => !x.closed && done[i] === undefined).length;
    return {
      accent, items, cur, openCount,
      badge: openCount ? { bg: '#fbbf24', fg: '#1a1305' } : { bg: '#1f3556', fg: '#9fb3c8' },
      subtitle: openCount ? openCount + ' open. A run waits on its blocking questions and approvals; approvals fail closed at their deadline.' : 'All caught up. Agents are working.',
    };
  }
}
</script>
</body>
</html>
