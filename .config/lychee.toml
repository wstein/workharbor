# Link checker settings for lychee (.github/workflows/docs-quality.yml).
# github.com answers a burst with 503 on its blob pages: 8 and 4 at a time failed six
# links in every run, 2 failed none (measured 2 October 2026, lychee 0.24.2).
max_concurrency = 2
timeout = 20
max_retries = 3
retry_wait_time = 2
# 429 and 503 mean rate limited or overloaded, not broken. An accepted status is
# not retried, and it is accepted for every host: a page that only ever answers
# 503 passes. Retries cover timeouts and the other 5xx.
accept = ["200..=299", "429", "503"]
# CHANGELOG.md is generated from commits; its commit links only resolve after a push.
exclude_path = ["CHANGELOG.md", "docs/vendor", "_site"]
# GitHub user projects return 404 to unauthenticated clients.
# OpenAI help center blocks datacenter IPs with Cloudflare bot challenges (403).
exclude = [
  '^https://github\.com/users/wstein/projects/6',
  '^https://help\.openai\.com/',
  # Google's developer site answers datacenter IPs with 500 (CI, 1 October 2026); it loads from a browser.
  '^https://ai\.google\.dev/',
  # The README badges. img.shields.io resets connections from the CI runner (run
  # 37144033503, "Connection reset by peer", on the license badge); retries do not help.
  # Tradeoff: a badge is decoration, not content, and a dead one shows as a broken
  # image in the README, so CI no longer catches it.
  '^https://img\.shields\.io/',
]
