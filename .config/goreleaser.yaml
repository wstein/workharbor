# GoReleaser configuration for the release workflow (design D24, §13). Run it
# through the workflow or `make release-snapshot`; nothing here publishes.
version: 2

project_name: whr

before:
  hooks:
    - go mod verify

builds:
  - id: whr
    main: ./cmd/whr
    binary: bin/whr
    env: [CGO_ENABLED=0]
    goos: [darwin]
    goarch: [arm64] # Apple silicon only; no Intel or Linux host build is released
    flags: [-trimpath]
    ldflags: &ldflags
      - -X github.com/wstein/workharbor/internal/version.Version={{.Tag}}
      - -X github.com/wstein/workharbor/internal/version.Commit={{.ShortCommit}}
      - -X github.com/wstein/workharbor/internal/version.Date={{.CommitDate}}
      - -X github.com/wstein/workharbor/internal/version.Dirty=false
  # The launcher and the egress proxy run in the Linux guests, which are arm64
  # on Apple silicon (what `make install` builds too).
  - id: whr-shim
    main: ./cmd/whr-shim
    binary: whr-shim-linux-arm64
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [arm64]
    flags: [-trimpath]
    ldflags: *ldflags
  - id: whr-proxy
    main: ./cmd/whr-proxy
    binary: whr-proxy-linux-arm64
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [arm64]
    flags: [-trimpath]
    ldflags: *ldflags

# One archive per release (#489): the host binary, the Linux guest binaries as
# payload (never run on the host) and the installer, built from the same commit.
# The guest binaries come from dist/ by glob: the build ids above fix the paths.
archives:
  - id: whr
    ids: [whr]
    formats: [tar.gz]
    name_template: "whr_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info: {mode: 0755, owner: root, group: wheel}
    files:
      - src: LICENSE
        info: {owner: root, group: wheel}
      - src: README.md
        info: {owner: root, group: wheel}
      - src: scripts/install-release.sh
        dst: install.sh
        info: {mode: 0755, owner: root, group: wheel}
      - src: dist/whr-shim_linux_arm64*/whr-shim-linux-arm64
        dst: guest
        info: {mode: 0755, owner: root, group: wheel}
      - src: dist/whr-proxy_linux_arm64*/whr-proxy-linux-arm64
        dst: guest
        info: {mode: 0755, owner: root, group: wheel}

checksum:
  name_template: checksums.txt
  algorithm: sha256

# One SBOM of the module's dependencies (CycloneDX), from a pinned tool. It
# runs in dist/, hence the module path "..", and reads the main module's
# version from a git tag, so a snapshot without one
# skips it (--skip=sbom).
sboms:
  - id: sbom
    artifacts: any
    cmd: go
    args:
      - run
      - github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
      - app
      - -json
      - -main
      - cmd/whr
      - -output
      - "${document}"
      - ..
    documents:
      - "whr_{{ .Version }}_sbom.cdx.json"

# Release notes come from git-cliff (the workflow passes --release-notes), not
# from GoReleaser's own changelog. Do not set changelog.disable: it skips the
# step that loads that file, and the release body ends up empty (#163). With
# --release-notes set, GoReleaser generates no changelog of its own.
# The release is a draft: a human publishes it.
release:
  draft: true
  prerelease: auto
