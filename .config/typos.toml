# Spell checker settings for typos (.github/workflows/docs-quality.yml, make check-ci).
[files]
ignore-hidden = false
extend-exclude = [
  ".git/",              # the repository database: ignore-hidden = false would walk it
  "LICENSE",            # EUPL text, with its own spelling
  ".github/CODE_OF_CONDUCT.md", # third-party text
  "CHANGELOG.md",       # generated
  "go.sum",
  "internal/web/static/htmx.min.js", # vendored, minified (see static/VENDORED.md)
  "internal/web/static/sse.js",      # vendored
  "**/testdata/**/*.jsonl",       # agent stream fixtures (in testdata/ and subdirectories)
  "**/testdata/*.jsonl",
  "**/testdata/**/*.golden.json", # outputs generated from them
  "**/testdata/*.golden.json",
]

[default.extend-words]
cose = "cose" # the COSE key format of WebAuthn
COSE = "COSE"
intoto = "intoto" # the in-toto attestation file name (.intoto.jsonl)

[default]
extend-ignore-re = [
  "\\(ba\\|z\\|da\\|k\\|c\\|tc\\|fi\\)\\?sh", # ghguard shellWord: the sh/bash/zsh/dash/... alternation
  "caf\\\\u00e9",                             # confirm record fixtures: the escaped e-acute of "café"
  "grap\\[h\\]ql",                          # ghguard test fixture: deliberate regex-evasion string
]
