# git-cliff configuration: https://git-cliff.org/docs/configuration
[changelog]
header = """
# Changelog

All notable changes to workharbor are documented here. The file is generated from
Conventional Commits by `make changelog`; do not edit it by hand.

"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
<details><summary>{{ group | striptags | trim | upper_first }} ({{ commits | length }})</summary>
{% for commit in commits %}
{% set subject = commit.message | split(pat="\n") | first | upper_first | trim %}\
{% set_global seen = subject %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ subject }}\
{% for footer in commit.footers %}\
{% if footer.token is matching("^(Closes|Fixes|Resolves|Refs|Related)$") and seen is not containing(footer.value) %} ({{ footer.value }}){% set_global seen = seen ~ " " ~ footer.value %}{% endif %}\
{% endfor %} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/wstein/workharbor/commit/{{ commit.id }}))\
{% endfor %}

</details>
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
sort_commits = "oldest"
# Only changes a user of whr notices are listed: features, fixes, performance,
# reverts and breaking changes. Internal types (docs, tests, refactoring, build,
# CI, style, chores) are skipped; protect_breaking_commits keeps a breaking one
# of any type. A Changelog trailer (AGENTS.md) overrides the type, but never
# hides or moves a breaking change, so the breaking parsers come first. The HTML comments order the groups and are stripped on output.
commit_parsers = [
  { message = "^[a-z]+(\\([^)]*\\))?!:", group = "<!-- 1 -->Breaking changes" },
  { footer = "^BREAKING[ -]CHANGE", group = "<!-- 1 -->Breaking changes" },
  { footer = "^Changelog: ?skip$", skip = true },
  { footer = "^Changelog: ?highlight$", group = "<!-- 0 -->Highlights" },
  { message = "^feat", group = "<!-- 2 -->Features" },
  { message = "^fix", group = "<!-- 3 -->Bug fixes" },
  { message = "^perf", group = "<!-- 4 -->Performance" },
  { message = "^revert", group = "<!-- 5 -->Reverts" },
  { message = "^(docs|test|refactor|build|ci|style|chore)", skip = true },
]
