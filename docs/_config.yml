title: workharbor
description: Self-hosted supervisor for AI coding agents. Isolated workspaces, human-in-the-loop decisions, and the whr CLI.
url: https://wstein.github.io
baseurl: /workharbor

theme: just-the-docs
plugins:
  - jekyll-include-cache
  - jekyll-seo-tag

# The light scheme is compiled into the default stylesheet; the dark one lives in
# assets/css/harbor-dark.scss and is switched by prefers-color-scheme or the toggle.
color_scheme: harbor
favicon_ico: /assets/images/favicon.ico
search_enabled: true
heading_anchors: true

kramdown:
  toc_levels: 2..2

callouts_level: quiet
callouts:
  warning:
    title: Design phase
    color: yellow
  note:
    title: Note
    color: blue

aux_links:
  GitHub: https://github.com/wstein/workharbor
aux_links_new_tab: true

footer_content: >-
  Released under the <a href="https://github.com/wstein/workharbor/blob/main/LICENSE">EUPL-1.2</a>.

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
