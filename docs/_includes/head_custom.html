<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1b33" media="(prefers-color-scheme: dark)">

{%- comment -%}
  The dark stylesheet follows the system setting by default. The toggle stores an
  explicit choice and forces it by changing the link's media query.
{%- endcomment -%}
<link rel="stylesheet" id="wh-dark-css" href="{{ '/assets/css/harbor-dark.css' | relative_url }}" media="(prefers-color-scheme: dark)">
<script>
  (function () {
    var KEY = 'wh-theme';
    var link = document.getElementById('wh-dark-css');
    var root = document.documentElement;
    var query = window.matchMedia('(prefers-color-scheme: dark)');

    function apply(mode) {
      link.media = mode === 'dark' ? 'all' : mode === 'light' ? 'not all' : '(prefers-color-scheme: dark)';
      root.setAttribute('data-theme', mode);
    }

    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) { /* storage unavailable */ }
    apply(saved === 'light' || saved === 'dark' ? saved : 'auto');

    window.whToggleTheme = function () {
      var mode = root.getAttribute('data-theme');
      var dark = mode === 'dark' || (mode === 'auto' && query.matches);
      var next = dark ? 'light' : 'dark';
      apply(next);
      try { localStorage.setItem(KEY, next); } catch (e) { /* storage unavailable */ }
    };
  })();
</script>
