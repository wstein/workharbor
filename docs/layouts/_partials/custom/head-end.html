{{- /* Colour of the mobile browser chrome; follows the active theme (dark by default). */ -}}
<meta name="theme-color" content="#0c1b33" />
<script>
  (function () {
    var meta = document.querySelector('meta[name="theme-color"]');
    function sync() {
      meta.content = document.documentElement.classList.contains('light') ? '#ffffff' : '#0c1b33';
    }
    sync();
    new MutationObserver(sync).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
  })();
</script>
{{- with resources.Get "css/fonts.css" | resources.ExecuteAsTemplate "css/fonts.css" . | fingerprint }}
<link rel="preload" href="{{ "fonts/ibm-plex-sans/IBMPlexSans-Regular.woff2" | relURL }}" as="font" type="font/woff2" crossorigin />
<link href="{{ .RelPermalink }}" rel="stylesheet" integrity="{{ .Data.Integrity }}" />
{{- end }}
